[project]
name = "gridpulse-agent"
version = "0.1.0"
description = "LangGraph analytics assistant that answers only through GridPulse's governed metrics."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-aws",
    "langchain-anthropic",
    "langchain-ollama",
    "langchain-openai",  # temporary, local only (ADR-0003)
    "httpx",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "streamlit",
]

[project.scripts]
gridpulse-agent = "gridpulse_agent.api:main"
gridpulse-agent-eval = "gridpulse_agent.evals:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridpulse_agent"]
