name: gridpulse
version: "0.1.0"
config-version: 2
profile: gridpulse

model-paths: [models]
seed-paths: [seeds]
macro-paths: [macros]
snapshot-paths: [snapshots]
test-paths: [tests]
clean-targets: [target, dbt_packages]

flags:
  require_certificate_validation: true

vars:
  # Days the daily ingestion sweep re-pulls to catch revisions (blueprint: 30).
  revision_window_days: 30
  # Reconciliation (blueprint B1 "done when"): a BA-hour reconciles when two independent EIA
  # series agree within this fraction (or 1 MWh), and each BA must reconcile this share of hours.
  reconciliation_tolerance: 0.01
  reconciliation_min_pass_rate: 0.98
  # Quality flags: a value is a spike when it differs from BOTH adjacent hours by more than this
  # fraction in the same direction (the largest real hour-to-hour demand step in the Jul-Oct 2026
  # sample was 22.7%). A level shift moves away from only one neighbour, so it is not flagged.
  spike_threshold: 0.5

seeds:
  gridpulse:
    +schema: reference
    ba_reference:
      +column_types:
        is_generation_only: boolean
        is_active: boolean
        activation_date: date
        retirement_date: date
    reconciliation_exceptions:
      +column_types:
        observed_on: date
    fuel_type_map:
      +column_types:
        is_renewable: boolean
        is_storage: boolean

models:
  gridpulse:
    # Athena: every table is Iceberg (Trino's catalog is Iceberg-only, so it ignores this).
    +table_type: iceberg
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
    marts:
      +schema: marts
      +materialized: table
      +contract:
        enforced: true
