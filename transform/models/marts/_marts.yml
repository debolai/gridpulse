version: 2

models:
  - name: dim_balancing_authority
    description: >
      One row per U.S. balancing authority in EIA-930, built from EIA's reference tables
      (seed `ba_reference`, generated by transform/scripts/build_ba_reference.py).
    semantic_model:
      enabled: true
      name: balancing_authorities
    agg_time_dimension: activation_date
    metrics:
      - name: active_balancing_authorities
        label: Active balancing authorities
        description: >
          Number of balancing authorities in EIA's reference list that have not retired, with
          or without data loaded. For lookups (which BAs make up a region); hidden from the
          agent.
        type: simple
        agg: sum
        expr: case when retirement_date is null then 1 else 0 end
    columns:
      - name: ba_code
        data_type: varchar
        description: EIA balancing authority code.
        constraints:
          - type: not_null
        data_tests: [unique]
        entity:
          type: primary
          name: balancing_authority
      - name: ba_name
        data_type: varchar
        dimension:
          type: categorical
          name: ba_name
          description: Full name of the balancing authority, e.g. "PJM Interconnection, LLC".
      - name: region_code
        data_type: varchar
        description: EIA region code (CAL, TEX, MIDA, ...).
        dimension:
          type: categorical
          name: region
          description: EIA region code, e.g. CAL (California), TEX (Texas), MIDA (Mid-Atlantic).
      - name: region_name
        data_type: varchar
        dimension:
          type: categorical
          name: region_name
          description: EIA region name, e.g. California, Carolinas, Florida, Mid-Atlantic.
      - name: interconnection
        data_type: varchar
        description: Eastern, Western or ERCOT. Derived from region; see the seed script.
        dimension:
          type: categorical
          name: interconnection
          description: Power grid the BA belongs to (Eastern, Western or ERCOT).
        data_tests:
          - accepted_values:
              arguments:
                values: ["Eastern", "Western", "ERCOT"]
      - name: time_zone
        data_type: varchar
        description: >
          IANA time zone where the BA operates, used for local time. Differs from
          eia_time_zone for BAs that report in "Arizona" time but observe DST (EPE, PNM, WACM).
        data_tests: [not_null]
      - name: eia_time_zone
        data_type: varchar
        description: EIA's reporting time-zone label (Eastern, Central, Mountain, Pacific, Arizona).
      - name: is_generation_only
        data_type: boolean
        description: Generation-only BAs report net generation and interchange but not demand.
      - name: is_active
        data_type: boolean
      - name: activation_date
        data_type: date
        granularity: day
        dimension:
          type: time
          name: activation_date
          description: Date the BA started operating (EIA reference).
      - name: retirement_date
        data_type: date

  - name: fct_grid_hourly
    description: >
      Hourly grid operations per balancing authority. Grain: BA × UTC hour. UTC is the key
      (it never repeats or skips); local time is derived per BA and is DST-aware, so a
      fall-back day has two rows with the same local hour.
    semantic_model:
      enabled: true
      name: grid_hourly
    primary_entity: grid_hour
    agg_time_dimension: period_utc
    metrics:
      - name: demand
        label: Demand (MWh)
        description: >
          Total electricity demand (load) in MWh: the sum of hourly demand over the selected
          hours and balancing authorities. Hours the BA did not report, and values flagged
          suspect or invalid (one-hour spikes, zeros), are excluded; flagged_values counts
          them. Synonyms: load, consumption, usage.
        type: simple
        agg: sum
        expr: case when demand_quality_status = 'ok' then demand_mwh end
        config:
          meta:
            agent: true
            unit: MWh
            additive: true
            synonyms: [load, consumption, usage]
            quality: Excludes demand values flagged suspect (one-hour spikes) or invalid (zeros).
      - name: peak_demand
        label: Peak hourly demand (MW)
        description: >
          Highest single-hour demand of one balancing authority in the period (MWh in one
          hour = average MW). NOT a system peak: when grouped across several BAs it returns
          the largest individual BA-hour, not the combined peak. For a region's combined
          peak use coincident_peak_demand. Flagged values (spikes, zeros) are excluded, so a
          one-hour reporting spike can't become the peak.
        type: simple
        agg: max
        expr: case when demand_quality_status = 'ok' then demand_mwh end
        config:
          meta:
            agent: true
            unit: MW
            additive: false
            synonyms: [max load, peak load]
            quality: Excludes demand values flagged suspect (one-hour spikes) or invalid (zeros).
      - name: forecast_error_mape
        label: Day-ahead forecast error (MAPE, %)
        description: >
          Mean absolute percentage error of the BA's day-ahead demand forecast:
          average of |actual - forecast| / actual x 100 over hours where actual demand > 0 and
          both values were reported and not flagged. Lower is better.
        type: simple
        agg: average
        expr: >
          case when demand_quality_status = 'ok' and demand_forecast_quality_status = 'ok'
          and demand_mwh > 0
          then abs(demand_mwh - demand_forecast_mwh) / demand_mwh * 100 end
        config:
          meta:
            agent: true
            unit: percent
            additive: false
            synonyms: [forecast accuracy, forecast miss]
            quality: Excludes hours where demand or the forecast is flagged suspect or invalid (spikes, zeros).
      - name: forecast_bias
        label: Day-ahead forecast bias (MWh)
        description: >
          Average of (forecast - actual) demand per hour, over hours where both were reported
          and neither is flagged. Positive means the operator over-forecast; negative means it
          under-forecast.
        type: simple
        agg: average
        expr: >
          case when demand_quality_status = 'ok' and demand_forecast_quality_status = 'ok'
          then demand_forecast_mwh - demand_mwh end
        config:
          meta:
            agent: true
            unit: MWh
            additive: false
            synonyms: [over-forecast, under-forecast]
            quality: Excludes hours where demand or the forecast is flagged suspect or invalid (spikes, zeros).
      - name: net_generation
        label: Net generation (MWh)
        description: >
          Total net generation in MWh (EIA series NG): electricity the BA's plants produced
          minus their own use, summed over the selected hours and balancing authorities. For
          the split by fuel use generation_by_fuel. Values flagged suspect (spikes, zeros,
          negatives) are excluded. Synonyms: generation, output, production.
        type: simple
        agg: sum
        expr: case when net_generation_quality_status = 'ok' then net_generation_mwh end
        config:
          meta:
            agent: true
            unit: MWh
            additive: true
            synonyms: [generation, output, production]
            quality: >-
              Excludes net generation values flagged suspect (one-hour spikes, zeros,
              negatives).
      - name: net_imports
        label: Net imports (MWh)
        description: >
          Electricity the BA took in from its neighbours minus what it sent out, MWh: -1 x
          total interchange (EIA reports exports as positive; this flips the sign so imports
          read positive). Negative = net exporter. Summed over several BAs, flows between them
          roughly cancel, leaving the group's exchange with everyone else.
          Synonyms: imports, interchange, power imported.
        type: simple
        agg: sum
        expr: case when total_interchange_quality_status = 'ok' then -1 * total_interchange_mwh end
        config:
          meta: {agent: true, unit: MWh, additive: true, synonyms: [imports, interchange, power imported]}
      - name: cooling_degree_hours
        label: Cooling degree hours (°C·h)
        description: >
          How much air-conditioning weather the BA had: the sum over hours of
          max(temperature - 18.3 °C, 0), using the BA's population-weighted temperature
          (18.3 °C = 65 °F, the U.S. convention). Higher = hotter. Hours without a temperature
          are skipped (NOAA publishes about 1.5 days after EIA). Summed across several BAs it
          adds their totals; compare BAs by grouping by balancing_authority.
          Synonyms: CDH, heat, cooling demand weather.
        type: simple
        agg: sum
        expr: greatest(temperature_c - 18.3, 0)
        config:
          meta: {agent: true, unit: degC_hours, additive: true, synonyms: [CDH, heat, hot weather]}
      - name: flagged_values
        label: Flagged values
        description: >
          How many hourly values failed the quality checks and are left out of the other
          metrics: demand, day-ahead forecast and net generation values flagged suspect
          (one-hour spike, zero forecast or generation, negative generation) or invalid (zero
          demand), counted per BA-hour and series. Use it to ask how clean the data behind an
          answer is. Synonyms: bad data, spikes, anomalies, quality issues.
        type: simple
        agg: sum
        expr: >
          case when demand_quality_status in ('suspect', 'invalid') then 1 else 0 end
          + case when demand_forecast_quality_status in ('suspect', 'invalid') then 1 else 0 end
          + case when net_generation_quality_status in ('suspect', 'invalid') then 1 else 0 end
        config:
          meta:
            agent: true
            unit: values
            additive: true
            synonyms: [bad data, spikes, anomalies, quality issues]
      - name: demand_month_to_date
        label: Demand, month to date (MWh)
        description: Cumulative demand from the start of each month.
        type: cumulative
        input_metric: demand
        grain_to_date: month
        # Rolled up to days/weeks, a running total must show the period's LAST value
        # (MetricFlow defaults to the first, which looked wrong in the A4 spike).
        period_agg: last
        config:
          meta:
            agent: true
            unit: MWh
            additive: true
            quality: Excludes demand values flagged suspect (one-hour spikes) or invalid (zeros).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba_code, period_utc]
    columns:
      - name: ba_code
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_balancing_authority')
                field: ba_code
        entity:
          type: foreign
          name: balancing_authority
      - name: period_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: Start of the hour, UTC.
        constraints:
          - type: not_null
        granularity: hour
        dimension:
          type: time
          name: period_utc
          description: Start of the hour in UTC. The default time axis (metric_time).
      - name: period_local
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: Start of the hour in the BA's local time zone.
        data_tests: [not_null]
      - name: date_local
        data_type: date
        granularity: day
        dimension:
          type: time
          name: date_local
          description: Calendar date in the BA's own time zone (DST-aware).
      - name: hour_local
        data_type: integer
        description: Local hour of day, 0-23.
        dimension:
          type: categorical
          name: hour_local
          description: Hour of day (0-23) in the BA's own time zone. Use for daily load shapes.
      - name: time_zone
        data_type: varchar
      - name: demand_mwh
        data_type: double
        description: Hourly demand (EIA series D), MWh.
      - name: demand_forecast_mwh
        data_type: double
        description: Day-ahead demand forecast for the hour (EIA series DF), MWh.
      - name: net_generation_mwh
        data_type: double
        description: Net generation (EIA series NG), MWh.
      - name: total_interchange_mwh
        data_type: double
        description: >
          Total interchange (EIA series TI), MWh. Positive = net exports, negative = net
          imports. The semantic layer's net_imports metric flips the sign.
      - name: demand_quality_status
        data_type: varchar
        description: >
          Quality of demand_mwh for the hour: ok, suspect (spike, or an implausible zero or
          negative), invalid (impossible value) or missing. See int_grid__quality_flags.
        data_tests:
          - accepted_values:
              arguments:
                values: ["ok", "suspect", "invalid", "missing"]
      - name: demand_forecast_quality_status
        data_type: varchar
        description: >
          Quality of demand_forecast_mwh for the hour: ok, suspect (spike, or an implausible zero or
          negative), invalid (impossible value) or missing. See int_grid__quality_flags.
        data_tests:
          - accepted_values:
              arguments:
                values: ["ok", "suspect", "invalid", "missing"]
      - name: net_generation_quality_status
        data_type: varchar
        description: >
          Quality of net_generation_mwh for the hour: ok, suspect (spike, or an implausible zero or
          negative), invalid (impossible value) or missing. See int_grid__quality_flags.
        data_tests:
          - accepted_values:
              arguments:
                values: ["ok", "suspect", "invalid", "missing"]
      - name: total_interchange_quality_status
        data_type: varchar
        description: >
          Quality of total_interchange_mwh for the hour: ok or missing (interchange changes
          sign as flows reverse, so zero, negative and spike rules do not apply).
        data_tests:
          - accepted_values:
              arguments:
                values: ["ok", "suspect", "invalid", "missing"]
      - name: temperature_c
        data_type: double
        description: >
          Population-weighted air temperature across the BA's main metro areas, °C (NOAA
          GHCNh; seed ba_weather_stations). Null until NOAA publishes the hour (about 1.5 days).
      - name: temperature_weight_coverage
        data_type: double
        description: Share of the BA's station population weight that had a temperature (1.0 = all).
      - name: last_ingested_at_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: Latest load that changed anything in this BA-hour (grid series or weather).

  - name: fct_grid_coverage_hourly
    description: >
      Every hour each BA was expected to report (grain: BA × UTC hour), with flags for which
      series it actually reported. The denominator for data_completeness.
    semantic_model:
      enabled: true
      name: grid_coverage_hourly
    primary_entity: coverage_hour
    agg_time_dimension: period_utc
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba_code, period_utc]
    metrics:
      - name: expected_hours
        label: Expected BA-hours
        description: Number of BA-hours that should have data (one per BA per hour).
        type: simple
        agg: count
        expr: ba_code
      - name: demand_hours_reported
        label: BA-hours with demand reported
        description: BA-hours where demand was reported.
        type: simple
        agg: sum_boolean
        expr: is_demand_reported
      - name: demand_hours_valid
        label: BA-hours with valid demand
        description: BA-hours with a reported demand value that passed the quality checks.
        type: simple
        agg: sum_boolean
        expr: is_demand_valid
      - name: data_completeness
        label: Data completeness (demand, %)
        description: >
          Share of expected BA-hours that have a valid demand value (reported and not flagged
          as a spike or zero), as a fraction from 0 to 1. Expected hours run from each BA's
          first report to the latest hour with demand. Synonyms: coverage, missing data, gaps.
        type: ratio
        numerator: demand_hours_valid
        denominator: expected_hours
        config:
          meta: {agent: true, unit: fraction, additive: false, synonyms: [coverage, gaps, missing data]}
    columns:
      - name: ba_code
        data_type: varchar
        constraints:
          - type: not_null
        entity:
          type: foreign
          name: balancing_authority
      - name: period_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        constraints:
          - type: not_null
        granularity: hour
        dimension:
          type: time
          name: period_utc
      - name: is_demand_reported
        data_type: boolean
      - name: is_demand_valid
        data_type: boolean
        description: Demand was reported and its quality status is ok (not a spike or zero).
      - name: is_forecast_reported
        data_type: boolean
      - name: is_net_generation_reported
        data_type: boolean
      - name: is_interchange_reported
        data_type: boolean

  - name: fct_demand_scope_hourly
    description: >
      Hourly demand summed over standard groups of balancing authorities (each
      interconnection, each EIA region, the Lower 48). Grain: scope x UTC hour. Every expected
      hour is kept; bas_reported / bas_expected show how complete each hour is. The basis for
      coincident_peak_demand.
    semantic_model:
      enabled: true
      name: demand_scope_hourly
    primary_entity: demand_scope
    agg_time_dimension: period_utc
    metrics:
      - name: coincident_peak_demand
        label: Coincident peak demand (MW)
        description: >
          System peak of a group of balancing authorities: the highest hour of their COMBINED
          demand (MWh in one hour = average MW). Always filter or group by
          demand_scope__scope_code: an interconnection (Eastern, Western, ERCOT), an EIA region
          (CAL, TEX, MIDA, NY, ...) or US48 for the whole Lower 48. Lower than adding up each
          BA's own peak, because BAs peak at different hours. Arbitrary sets of BAs are not
          supported. A BA that didn't report, or whose value is flagged (spike, zero), is left
          out of that hour's total; filter demand_scope__is_complete = true to use only hours
          where every BA reported a valid value.
          Synonyms: system peak, regional peak, combined peak.
        type: simple
        agg: max
        expr: demand_mwh
        config:
          meta:
            agent: true
            unit: MW
            additive: false
            synonyms: [system peak, regional peak, combined peak, grid peak]
            quality: >-
              Each hour's total leaves out BAs whose demand is flagged suspect or invalid
              (spikes, zeros).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [scope_id, period_utc]
    columns:
      - name: scope_type
        data_type: varchar
        description: interconnection, region or lower_48.
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: ["interconnection", "region", "lower_48"]
        dimension:
          type: categorical
          name: scope_type
          description: Kind of group - interconnection, region (EIA region) or lower_48.
      - name: scope_id
        data_type: varchar
        description: scope_type and scope_code together, e.g. "region:CAL" (unique per hour).
        constraints:
          - type: not_null
      - name: scope_code
        data_type: varchar
        description: Eastern / Western / ERCOT, an EIA region code (CAL, TEX, ...), or US48.
        constraints:
          - type: not_null
        dimension:
          type: categorical
          name: scope_code
          description: >
            The group: Eastern, Western or ERCOT (interconnections), an EIA region code such as
            CAL, TEX, MIDA, NY, NE, FLA, MIDW, CENT, CAR, SE, TEN, SW, NW, or US48.
      - name: period_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: Start of the hour, UTC.
        constraints:
          - type: not_null
        granularity: hour
        dimension:
          type: time
          name: period_utc
          description: Start of the hour in UTC.
      - name: demand_mwh
        data_type: double
        description: >
          Sum of valid demand across the scope's BAs for the hour, MWh (flagged values left
          out).
      - name: bas_expected
        data_type: integer
        description: BAs in the scope that should have reported demand this hour.
      - name: bas_reported
        data_type: integer
        description: BAs in the scope that did report demand this hour.
      - name: bas_flagged
        data_type: integer
        description: BAs whose demand this hour is flagged suspect or invalid (not summed).
      - name: is_complete
        data_type: boolean
        description: True when every expected BA reported a valid (unflagged) demand value.
        dimension:
          type: categorical
          name: is_complete
          description: True when every BA in the group reported a valid demand value for the hour.

  - name: fct_value_checks_hourly
    description: >
      How often each published EIA value was read and whether it ever changed. Grain: route ×
      BA × item × UTC hour (item = series, fuel or neighbour BA). Re-checked = seen by at least
      two loads; revised = re-checked and had more than one version. The basis for
      revision_rate.
    semantic_model:
      enabled: true
      name: value_checks_hourly
    primary_entity: value_check
    agg_time_dimension: period_utc
    metrics:
      - name: values_rechecked
        label: Values re-checked
        description: Published values (BA × item × hour) read by at least two loads.
        type: simple
        agg: sum_boolean
        expr: is_rechecked
      - name: values_revised
        label: Values revised
        description: Re-checked values whose number changed at least once after first publication.
        type: simple
        agg: sum_boolean
        expr: is_revised
      - name: revision_rate
        label: Revision rate (fraction)
        description: >
          Share of re-checked EIA values that the BA changed after first publishing them, as a
          fraction from 0 to 1. Only values the pipeline read at least twice count (recent
          hours are re-read for 30 days; older history loaded once can't show revisions).
          Group by value_check__route (region-data, fuel-type-data, interchange-data) or
          value_check__item_code (D = demand, DF = day-ahead forecast, NG, TI, a fuel code or a
          neighbour BA) to see what gets revised. Synonyms: data revisions, corrections.
        type: ratio
        numerator: values_revised
        denominator: values_rechecked
        config:
          meta:
            agent: true
            unit: fraction
            additive: false
            synonyms: [revisions, corrections, restatements, data changes]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [route, ba_code, item_code, period_utc]
    columns:
      - name: route
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: ["region-data", "fuel-type-data", "interchange-data"]
        dimension:
          type: categorical
          name: route
          description: EIA report - region-data (demand, forecast, NG, TI), fuel-type-data or interchange-data.
      - name: ba_code
        data_type: varchar
        constraints:
          - type: not_null
        entity:
          type: foreign
          name: balancing_authority
      - name: item_code
        data_type: varchar
        description: Series code (D, DF, NG, TI), fuel code or neighbour BA code, depending on the route.
        constraints:
          - type: not_null
        dimension:
          type: categorical
          name: item_code
          description: >
            What was published - D (demand), DF (day-ahead forecast), NG (net generation), TI
            (total interchange), a fuel code (NG, COL, SUN, ...) or a neighbour BA code.
      - name: period_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: The hour the value describes (UTC).
        constraints:
          - type: not_null
        granularity: hour
        dimension:
          type: time
          name: period_utc
          description: The hour the value describes, UTC.
      - name: loads
        data_type: integer
        description: Number of loads that read this value.
      - name: versions
        data_type: integer
        description: Number of distinct versions (record hashes) seen.
      - name: is_rechecked
        data_type: boolean
        description: Read by at least two loads.
      - name: is_revised
        data_type: boolean
        description: Re-checked and changed at least once (A -> B -> A counts).
      - name: last_ingested_at_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: Latest load that read this value.

  - name: dim_fuel_type
    description: >
      One row per EIA fuel code, from seed `fuel_type_map` (EIA's own labels for a code vary,
      so the seed is the single source of names and categories).
    semantic_model:
      enabled: true
      name: fuel_types
    columns:
      - name: fuel_code
        data_type: varchar
        description: EIA fuel code (COL, NG, NUC, WND, SUN, BAT, ...).
        constraints:
          - type: not_null
        data_tests: [unique]
        entity:
          type: primary
          name: fuel_type
      - name: fuel_name
        data_type: varchar
        data_tests: [not_null]
        dimension:
          type: categorical
          name: fuel_name
          description: Fuel name, e.g. Coal, Natural gas, Wind, Solar, Battery storage.
      - name: fuel_category
        data_type: varchar
        description: fossil, nuclear, renewable, storage or other.
        dimension:
          type: categorical
          name: fuel_category
          description: Broad fuel group - fossil, nuclear, renewable, storage or other.
        data_tests:
          - accepted_values:
              arguments:
                values: ["fossil", "nuclear", "renewable", "storage", "other"]
      - name: is_renewable
        data_type: boolean
        description: Wind, solar, hydro, geothermal, including hybrids with integrated storage.
        dimension:
          type: categorical
          name: is_renewable
          description: True for wind, solar, hydro and geothermal (including hybrids with storage).
      - name: is_storage
        data_type: boolean
        description: Storage or hybrid with storage; these can report negative (charging) hours.

  - name: fct_generation_by_fuel_hourly
    description: >
      Hourly net generation by fuel per balancing authority. Grain: BA × fuel × UTC hour.
      Storage fuels are negative while charging. For a BA-hour, the fuels should add up to
      net generation in fct_grid_hourly (see the reconciliation test).
    semantic_model:
      enabled: true
      name: generation_by_fuel_hourly
    primary_entity: fuel_hour
    agg_time_dimension: period_utc
    metrics:
      - name: generation_by_fuel
        label: Generation by fuel (MWh)
        description: >
          Net generation in MWh from EIA's fuel-type report. Group by fuel_type__fuel_name,
          fuel_type__fuel_category or fuel_type__is_renewable for the fuel mix; filter on a
          fuel for one source ("wind generation"). Storage counts negative while charging.
          Summed over all fuels it is close to net_generation but comes from a separate report.
          Synonyms: fuel mix, generation mix, output by source.
        type: simple
        agg: sum
        expr: generation_mwh
        config:
          meta: {agent: true, unit: MWh, additive: true, synonyms: [fuel mix, generation mix, output by source]}
      - name: renewable_generation
        label: Renewable generation (MWh)
        description: >
          Net generation from wind, solar, hydro and geothermal (including hybrids with
          storage), MWh. Synonyms: clean generation, green generation.
        type: simple
        agg: sum
        expr: generation_mwh
        filter: "{{ Dimension('fuel_type__is_renewable') }} = true"
        config:
          meta: {agent: true, unit: MWh, additive: true, synonyms: [green generation, clean generation]}
      - name: renewable_share
        label: Renewable share of generation (fraction)
        description: >
          Renewable generation divided by generation from all fuels, as a fraction from 0 to 1
          (0.35 = 35%). A ratio of sums over the selected hours and BAs, never an average of
          hourly shares. Both parts come from the same fuel-type report, so the share is
          consistent even where fuels and net generation disagree.
          Synonyms: renewables percentage, green share.
        type: ratio
        numerator: renewable_generation
        denominator: generation_by_fuel
        config:
          meta:
            agent: true
            unit: fraction
            additive: false
            synonyms: [renewables percentage, green share, clean share]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba_code, fuel_code, period_utc]
    columns:
      - name: ba_code
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_balancing_authority')
                field: ba_code
        entity:
          type: foreign
          name: balancing_authority
      - name: fuel_code
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_fuel_type')
                field: fuel_code
              config:
                severity: warn
        entity:
          type: foreign
          name: fuel_type
      - name: period_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: Start of the hour, UTC.
        constraints:
          - type: not_null
        granularity: hour
        dimension:
          type: time
          name: period_utc
          description: Start of the hour in UTC.
      - name: period_local
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: Start of the hour in the BA's local time zone.
        data_tests: [not_null]
      - name: date_local
        data_type: date
        granularity: day
        dimension:
          type: time
          name: date_local
          description: Calendar date in the BA's own time zone (DST-aware).
      - name: hour_local
        data_type: integer
        description: Local hour of day, 0-23.
        dimension:
          type: categorical
          name: hour_local
          description: Hour of day (0-23) in the BA's own time zone, e.g. for solar's daily shape.
      - name: generation_mwh
        data_type: double
        description: Net generation from this fuel, MWh. Null when the BA did not report it.
      - name: last_ingested_at_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: The load that last changed this value.

  - name: fct_interchange_hourly
    description: >
      Hourly directional flow between a balancing authority and each directly connected
      neighbour, as reported by the BA. Grain: BA × neighbour × UTC hour. Positive = the BA
      exports to the neighbour. For a BA-hour the flows add up to total_interchange_mwh in
      fct_grid_hourly (see the reconciliation test). Neighbours outside the U.S. are kept and
      flagged with is_international_neighbor.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba_code, neighbor_ba_code, period_utc]
    columns:
      - name: ba_code
        data_type: varchar
        description: Reporting balancing authority.
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_balancing_authority')
                field: ba_code
      - name: neighbor_ba_code
        data_type: varchar
        description: Directly connected balancing authority (U.S., Canadian or Mexican).
        constraints:
          - type: not_null
      - name: neighbor_ba_name
        data_type: varchar
        description: Neighbour's name as EIA reports it (the only name source for non-U.S. operators).
      - name: is_international_neighbor
        data_type: boolean
        description: True when the neighbour is not a U.S. balancing authority in dim_balancing_authority.
        data_tests: [not_null]
      - name: period_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: Start of the hour, UTC.
        constraints:
          - type: not_null
      - name: period_local
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: Start of the hour in the reporting BA's local time zone.
        data_tests: [not_null]
      - name: date_local
        data_type: date
      - name: hour_local
        data_type: integer
      - name: interchange_mwh
        data_type: double
        description: >
          Flow in MWh. Positive = ba_code exports to neighbor_ba_code, negative = imports.
          The semantic layer's net_imports metric flips the sign.
      - name: last_ingested_at_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: The load that last changed this value.

  - name: fct_data_revisions
    description: >
      Audit of EIA revisions: one row per change to a published value, with its size and how
      late it came. Grain: route × BA × item × hour × revising load. item_code is the series
      (region-data: D, DF, NG, TI), the fuel (fuel-type-data) or the neighbour BA
      (interchange-data). Answers "how much does a BA revise its data, and how late?".
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [route, ba_code, item_code, period_utc, revised_at_utc]
    columns:
      - name: route
        data_type: varchar
        constraints:
          - type: not_null
      - name: ba_code
        data_type: varchar
        constraints:
          - type: not_null
      - name: item_code
        data_type: varchar
        description: Series code, fuel code or neighbour BA code, depending on the route.
        constraints:
          - type: not_null
      - name: period_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: The hour that was revised (UTC).
        constraints:
          - type: not_null
      - name: revision_type
        data_type: varchar
        description: changed, filled (null to a value) or removed (a value to null).
        data_tests:
          - accepted_values:
              arguments:
                values: ["changed", "filled", "removed"]
      - name: previous_value_mwh
        data_type: double
      - name: revised_value_mwh
        data_type: double
      - name: change_mwh
        data_type: double
        description: revised minus previous; null for filled and removed.
      - name: change_ratio
        data_type: double
        description: change_mwh as a fraction of the previous absolute value (0.05 = +5%).
      - name: previous_ingested_at_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: Start of the load that had observed the previous value.
      - name: revised_at_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: Start of the load that first observed the revised value.
        constraints:
          - type: not_null
      - name: hours_after_period
        data_type: integer
        description: >
          Hours between the start of the revised hour and the load that saw the change. An
          upper bound on how late EIA revised it: loads only run every so often.

  - name: fct_ingestion_runs
    description: >
      One row per extraction attempt across all sources (EIA routes, NOAA): window, rows
      expected, received and appended, duration, and errors. Feeds pipeline-health views
      and the freshness story.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [run_id, started_at_utc]
    columns:
      - name: run_id
        data_type: varchar
        description: Deterministic id from route, window and scope (a rerun of the same window shares it).
        constraints:
          - type: not_null
      - name: route
        data_type: varchar
        description: region-data, fuel-type-data, interchange-data or noaa-ghcnh.
        constraints:
          - type: not_null
      - name: started_at_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        constraints:
          - type: not_null
      - name: status
        data_type: varchar
        description: succeeded, failed, or running (the process died before finishing).
        data_tests:
          - accepted_values:
              arguments:
                values: ["succeeded", "failed", "running"]
      - name: window_start_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
      - name: window_end_utc
        data_type: "{{ 'timestamp' if target.type == 'athena' else 'timestamp(6)' }}"
        description: Exclusive end of the requested window.
      - name: scope
        data_type: varchar
        description: JSON list of the BAs (EIA) or stations (NOAA) requested; [] = all BAs.
      - name: pages
        data_type: bigint
      - name: rows_expected
        data_type: bigint
        description: The total the EIA API reported; null for NOAA.
      - name: rows_received
        data_type: bigint
      - name: rows_appended
        data_type: bigint
      - name: is_complete
        data_type: boolean
        description: Succeeded, received every expected row, and appended everything it received.
      - name: duration_seconds
        data_type: double
      - name: error
        data_type: varchar
      - name: details
        data_type: varchar
        description: Other manifest fields as JSON (API warnings, unknown fields, missing stations).

unit_tests:
  - name: local_time_handles_dst_and_arizona
    description: >
      Spring-forward (2026-03-08) skips 02:00 in New York; fall-back (2026-11-01) repeats
      01:00. Phoenix never shifts. El Paso reports in EIA "Arizona" time but its clock follows
      Mountain DST, so 06:00 UTC in July is midnight local.
    model: fct_grid_hourly
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('dim_balancing_authority')
        format: csv
        rows: |
          ba_code,time_zone
          PJM,America/New_York
          AZPS,America/Phoenix
          EPE,America/Denver
      - input: ref('int_grid__latest_values')
        format: csv
        rows: |
          ba_code,series_code,period_utc,value_mwh,ingested_at_utc
          PJM,D,2026-03-08 06:00:00,1.0,2026-03-09 00:00:00
          PJM,D,2026-03-08 07:00:00,1.0,2026-03-09 00:00:00
          PJM,D,2026-11-01 05:00:00,1.0,2026-11-02 00:00:00
          PJM,D,2026-11-01 06:00:00,1.0,2026-11-02 00:00:00
          AZPS,D,2026-03-08 09:00:00,1.0,2026-03-09 00:00:00
          AZPS,D,2026-07-01 07:00:00,1.0,2026-07-02 00:00:00
          EPE,D,2026-07-01 06:00:00,1.0,2026-07-02 00:00:00
      - input: ref('int_grid__quality_flags')
        format: dict
        rows: []
      - input: ref('int_weather__ba_hourly')
        format: dict
        rows: []
    expect:
      format: csv
      rows: |
        ba_code,period_utc,period_local,date_local,hour_local
        PJM,2026-03-08 06:00:00,2026-03-08 01:00:00,2026-03-08,1
        PJM,2026-03-08 07:00:00,2026-03-08 03:00:00,2026-03-08,3
        PJM,2026-11-01 05:00:00,2026-11-01 01:00:00,2026-11-01,1
        PJM,2026-11-01 06:00:00,2026-11-01 01:00:00,2026-11-01,1
        AZPS,2026-03-08 09:00:00,2026-03-08 02:00:00,2026-03-08,2
        AZPS,2026-07-01 07:00:00,2026-07-01 00:00:00,2026-07-01,0
        EPE,2026-07-01 06:00:00,2026-07-01 00:00:00,2026-07-01,0

  - name: series_pivot_to_columns
    description: >
      The four series for one BA-hour become one row; a missing series stays null and its
      quality status is "missing"; statuses come from int_grid__quality_flags.
    model: fct_grid_hourly
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('dim_balancing_authority')
        format: csv
        rows: |
          ba_code,time_zone
          ERCO,America/Chicago
      - input: ref('int_grid__latest_values')
        format: csv
        rows: |
          ba_code,series_code,period_utc,value_mwh,ingested_at_utc
          ERCO,D,2026-10-01 00:00:00,75544.0,2026-10-02 00:00:00
          ERCO,NG,2026-10-01 00:00:00,76000.0,2026-10-02 00:00:00
          ERCO,TI,2026-10-01 00:00:00,-456.0,2026-10-03 00:00:00
      - input: ref('int_grid__quality_flags')
        format: csv
        rows: |
          ba_code,series_code,period_utc,quality_status
          ERCO,D,2026-10-01 00:00:00,ok
          ERCO,NG,2026-10-01 00:00:00,suspect
          ERCO,TI,2026-10-01 00:00:00,ok
      - input: ref('int_weather__ba_hourly')
        format: dict
        rows: []
    expect:
      format: csv
      rows: |
        ba_code,period_utc,demand_mwh,demand_forecast_mwh,net_generation_mwh,total_interchange_mwh,demand_quality_status,demand_forecast_quality_status,net_generation_quality_status,total_interchange_quality_status,last_ingested_at_utc
        ERCO,2026-10-01 00:00:00,75544.0,,76000.0,-456.0,ok,missing,suspect,ok,2026-10-03 00:00:00

  - name: late_weather_fills_an_existing_hour
    description: >
      NOAA publishes about 1.5 days after EIA. An hour already built without temperature must
      be rebuilt when its weather arrives, even though no grid value changed.
    model: fct_grid_hourly
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        format: sql
        rows: |
          select 'PJM' as ba_code, timestamp '2026-10-01 00:00:00' as period_utc,
              timestamp '2026-10-05 00:00:00' as last_ingested_at_utc
      - input: ref('int_grid__latest_values')
        format: csv
        rows: |
          ba_code,series_code,period_utc,value_mwh,ingested_at_utc
          PJM,D,2026-10-01 00:00:00,90000.0,2026-10-05 00:00:00
      - input: ref('int_grid__quality_flags')
        format: csv
        rows: |
          ba_code,series_code,period_utc,quality_status
          PJM,D,2026-10-01 00:00:00,ok
      - input: ref('int_weather__ba_hourly')
        format: csv
        rows: |
          ba_code,period_utc,temperature_c,weight_coverage,last_ingested_at_utc
          PJM,2026-10-01 00:00:00,18.5,1.0,2026-10-07 00:00:00
      - input: ref('dim_balancing_authority')
        format: csv
        rows: |
          ba_code,time_zone
          PJM,America/New_York
    expect:
      format: csv
      rows: |
        ba_code,period_utc,demand_mwh,temperature_c,temperature_weight_coverage,last_ingested_at_utc
        PJM,2026-10-01 00:00:00,90000.0,18.5,1.0,2026-10-07 00:00:00

  - name: value_checks_count_rereads_and_versions
    description: >
      One load = published, not re-checked. An unchanged re-read is re-checked, not revised.
      A -> B -> A is revised. Two versions in a single load are not a revision.
    model: fct_value_checks_hourly
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_eia__observations')
        format: csv
        rows: |
          route,ba_code,item_code,period_utc,value_mwh,record_hash,ingested_at_utc
          region-data,PJM,D,2026-10-01 00:00:00,100.0,a,2026-10-01 02:00:00
          region-data,PJM,DF,2026-10-01 00:00:00,90.0,f,2026-10-01 02:00:00
          region-data,PJM,DF,2026-10-01 00:00:00,90.0,f,2026-10-02 02:00:00
          fuel-type-data,PJM,SUN,2026-10-01 00:00:00,5.0,s1,2026-10-01 02:00:00
          fuel-type-data,PJM,SUN,2026-10-01 00:00:00,6.0,s2,2026-10-02 02:00:00
          fuel-type-data,PJM,SUN,2026-10-01 00:00:00,5.0,s1,2026-10-03 02:00:00
          interchange-data,PJM,MISO,2026-10-01 00:00:00,1.0,i1,2026-10-01 02:00:00
          interchange-data,PJM,MISO,2026-10-01 00:00:00,2.0,i2,2026-10-01 02:00:00
    expect:
      format: csv
      rows: |
        route,ba_code,item_code,period_utc,loads,versions,is_rechecked,is_revised,last_ingested_at_utc
        region-data,PJM,D,2026-10-01 00:00:00,1,1,false,false,2026-10-01 02:00:00
        region-data,PJM,DF,2026-10-01 00:00:00,2,1,true,false,2026-10-02 02:00:00
        fuel-type-data,PJM,SUN,2026-10-01 00:00:00,3,2,true,true,2026-10-03 02:00:00
        interchange-data,PJM,MISO,2026-10-01 00:00:00,1,2,false,false,2026-10-01 02:00:00

  - name: demand_scope_leaves_out_flagged_and_missing_bas
    description: >
      Hour 1: A reports 100 (ok), B a flagged 1000 MWh spike, C nothing - the region sums only
      A and is incomplete. Hour 2: all three valid - summed and complete. G is generation-only
      and never expected.
    model: fct_demand_scope_hourly
    given:
      - input: ref('fct_grid_coverage_hourly')
        format: csv
        rows: |
          ba_code,period_utc,is_demand_reported
          A,2026-07-01 00:00:00,true
          B,2026-07-01 00:00:00,true
          C,2026-07-01 00:00:00,false
          G,2026-07-01 00:00:00,false
          A,2026-07-01 01:00:00,true
          B,2026-07-01 01:00:00,true
          C,2026-07-01 01:00:00,true
      - input: ref('dim_balancing_authority')
        format: csv
        rows: |
          ba_code,interconnection,region_code,is_generation_only
          A,Western,CAL,false
          B,Western,CAL,false
          C,Western,NW,false
          G,Western,NW,true
      - input: ref('fct_grid_hourly')
        format: csv
        rows: |
          ba_code,period_utc,demand_mwh,demand_quality_status
          A,2026-07-01 00:00:00,100.0,ok
          B,2026-07-01 00:00:00,1000.0,suspect
          A,2026-07-01 01:00:00,110.0,ok
          B,2026-07-01 01:00:00,50.0,ok
          C,2026-07-01 01:00:00,20.0,ok
    expect:
      format: csv
      rows: |
        scope_id,period_utc,demand_mwh,bas_expected,bas_reported,bas_flagged,is_complete
        interconnection:Western,2026-07-01 00:00:00,100.0,3,2,1,false
        region:CAL,2026-07-01 00:00:00,100.0,2,2,1,false
        region:NW,2026-07-01 00:00:00,,1,0,0,false
        lower_48:US48,2026-07-01 00:00:00,100.0,3,2,1,false
        interconnection:Western,2026-07-01 01:00:00,180.0,3,3,0,true
        region:CAL,2026-07-01 01:00:00,160.0,2,2,0,true
        region:NW,2026-07-01 01:00:00,20.0,1,1,0,true
        lower_48:US48,2026-07-01 01:00:00,180.0,3,3,0,true

  - name: coverage_valid_means_reported_and_not_flagged
    description: >
      An ok value is reported and valid; a flagged spike is reported but not valid; an hour
      with no row is neither.
    model: fct_grid_coverage_hourly
    given:
      - input: ref('fct_grid_hourly')
        format: csv
        rows: |
          ba_code,period_utc,demand_mwh,demand_quality_status
          PJM,2026-07-01 00:00:00,100.0,ok
          PJM,2026-07-01 01:00:00,900.0,suspect
          PJM,2026-07-01 03:00:00,105.0,ok
      - input: ref('dim_balancing_authority')
        format: csv
        rows: |
          ba_code,retirement_date
          PJM,
      - input: ref('time_spine_hourly')
        format: csv
        rows: |
          date_hour
          2026-07-01 00:00:00
          2026-07-01 01:00:00
          2026-07-01 02:00:00
          2026-07-01 03:00:00
    expect:
      format: csv
      rows: |
        ba_code,period_utc,is_demand_reported,is_demand_valid
        PJM,2026-07-01 00:00:00,true,true
        PJM,2026-07-01 01:00:00,true,false
        PJM,2026-07-01 02:00:00,false,false
        PJM,2026-07-01 03:00:00,true,true
