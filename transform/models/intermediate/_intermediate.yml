version: 2

models:
  - name: int_grid__latest_values
    description: >
      Latest observed value per balancing authority, series and hour. Grain: BA × series ×
      hour. When EIA revises an hour, the newest load wins, including when a value returns
      to an earlier one.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba_code, series_code, period_utc]
    columns:
      - name: ba_code
        data_tests: [not_null]
      - name: series_code
        data_tests: [not_null]
      - name: period_utc
        data_tests: [not_null]
      - name: value_mwh
        description: Latest value in MWh; null when the BA did not report the hour.
      - name: ingested_at_utc
        description: When this value was last observed (start of that load).
        data_tests: [not_null]

  - name: int_generation__latest_values
    description: >
      Latest observed net generation per balancing authority, fuel and hour. Grain: BA ×
      fuel × hour. Newest load wins, as in int_grid__latest_values.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba_code, fuel_code, period_utc]
    columns:
      - name: ba_code
        data_tests: [not_null]
      - name: fuel_code
        data_tests: [not_null]
      - name: period_utc
        data_tests: [not_null]
      - name: ingested_at_utc
        data_tests: [not_null]

  - name: int_interchange__latest_values
    description: >
      Latest observed flow per balancing authority, neighbour and hour. Grain: BA ×
      neighbour × hour. Newest load wins.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [from_ba_code, to_ba_code, period_utc]
    columns:
      - name: from_ba_code
        data_tests: [not_null]
      - name: to_ba_code
        data_tests: [not_null]
      - name: period_utc
        data_tests: [not_null]
      - name: ingested_at_utc
        data_tests: [not_null]

  - name: int_grid__quality_flags
    description: >
      Data-quality flags per balancing authority, series and hour (missing, zero, negative,
      one-hour spike) and a per-series quality_status: ok, suspect, invalid or missing. Bad
      values are flagged, never deleted. Grain: BA × series × hour.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba_code, series_code, period_utc]
    columns:
      - name: quality_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ok", "suspect", "invalid", "missing"]
      - name: is_spike
        description: >
          Differs from both adjacent hours by more than var('spike_threshold') in the same
          direction. Only for D, DF and NG; never across a gap in the data.
        data_tests: [not_null]

  - name: int_grid__revisions
    description: >
      Every change to a published EIA value across region-data, fuel-type-data and
      interchange-data. Grain: route × BA × item × hour × revising load, where item is the
      series, fuel or neighbour BA. Re-reading an unchanged value is not a revision.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [route, ba_code, item_code, period_utc, revised_at_utc]
    columns:
      - name: route
        data_tests:
          - accepted_values:
              arguments:
                values: ["region-data", "fuel-type-data", "interchange-data"]
      - name: revised_at_utc
        description: Start of the load that observed the new value.
        data_tests: [not_null]
      - name: previous_ingested_at_utc
        description: Start of the load that observed the value being replaced.
        data_tests: [not_null]

unit_tests:
  - name: latest_observation_wins_even_when_value_reverts
    description: >
      An hour revised A -> B -> A must end at A with the third load's time. Collapsing
      versions by hash before ranking would wrongly return B.
    model: int_grid__latest_values
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_eia__region_data')
        format: csv
        rows: |
          ba_code,series_code,series_name,period_utc,value_mwh,record_hash,run_id,ingested_at_utc
          PJM,D,Demand,2026-10-01 00:00:00,100.0,a,r1,2026-10-01 02:00:00
          PJM,D,Demand,2026-10-01 00:00:00,110.0,b,r2,2026-10-02 02:00:00
          PJM,D,Demand,2026-10-01 00:00:00,100.0,a,r3,2026-10-03 02:00:00
          PJM,NG,Net generation,2026-10-01 00:00:00,90.0,c,r1,2026-10-01 02:00:00
    expect:
      format: csv
      rows: |
        ba_code,series_code,period_utc,value_mwh,run_id,ingested_at_utc
        PJM,D,2026-10-01 00:00:00,100.0,r3,2026-10-03 02:00:00
        PJM,NG,2026-10-01 00:00:00,90.0,r1,2026-10-01 02:00:00

  - name: quality_flags_catch_spikes_zeros_and_gaps_but_not_level_shifts
    description: >
      One-hour spikes up and down are flagged; a level shift is not; demand of 0 is invalid;
      a null is missing; negative net generation is suspect; interchange changing sign is ok;
      a value after a gap is not compared with a non-adjacent hour.
    model: int_grid__quality_flags
    given:
      - input: ref('int_grid__latest_values')
        format: csv
        rows: |
          ba_code,series_code,period_utc,value_mwh
          AAA,D,2026-10-01 00:00:00,100
          AAA,D,2026-10-01 01:00:00,100
          AAA,D,2026-10-01 02:00:00,300
          AAA,D,2026-10-01 03:00:00,100
          AAA,D,2026-10-01 04:00:00,0
          AAA,D,2026-10-01 05:00:00,100
          AAA,D,2026-10-01 06:00:00,
          AAA,DF,2026-10-01 00:00:00,100
          AAA,DF,2026-10-01 01:00:00,100
          AAA,DF,2026-10-01 02:00:00,200
          AAA,DF,2026-10-01 03:00:00,200
          AAA,NG,2026-10-01 00:00:00,-5
          AAA,TI,2026-10-01 00:00:00,-500
          AAA,TI,2026-10-01 01:00:00,400
          AAA,TI,2026-10-01 02:00:00,-500
          BBB,D,2026-10-01 00:00:00,100
          BBB,D,2026-10-01 02:00:00,300
          BBB,D,2026-10-01 03:00:00,100
    expect:
      format: csv
      rows: |
        ba_code,series_code,period_utc,is_missing,is_zero,is_negative,is_spike,quality_status
        AAA,D,2026-10-01 00:00:00,false,false,false,false,ok
        AAA,D,2026-10-01 01:00:00,false,false,false,false,ok
        AAA,D,2026-10-01 02:00:00,false,false,false,true,suspect
        AAA,D,2026-10-01 03:00:00,false,false,false,false,ok
        AAA,D,2026-10-01 04:00:00,false,true,false,true,invalid
        AAA,D,2026-10-01 05:00:00,false,false,false,false,ok
        AAA,D,2026-10-01 06:00:00,true,false,false,false,missing
        AAA,DF,2026-10-01 00:00:00,false,false,false,false,ok
        AAA,DF,2026-10-01 01:00:00,false,false,false,false,ok
        AAA,DF,2026-10-01 02:00:00,false,false,false,false,ok
        AAA,DF,2026-10-01 03:00:00,false,false,false,false,ok
        AAA,NG,2026-10-01 00:00:00,false,false,true,false,suspect
        AAA,TI,2026-10-01 00:00:00,false,false,true,false,ok
        AAA,TI,2026-10-01 01:00:00,false,false,false,false,ok
        AAA,TI,2026-10-01 02:00:00,false,false,true,false,ok
        BBB,D,2026-10-01 00:00:00,false,false,false,false,ok
        BBB,D,2026-10-01 02:00:00,false,false,false,false,ok
        BBB,D,2026-10-01 03:00:00,false,false,false,false,ok


  - name: revisions_count_changes_not_rereads
    description: >
      An unchanged re-read is not a revision; A -> B -> A is two revisions; a value filled in
      late is a revision from null; fuel and interchange changes are tracked too.
    model: int_grid__revisions
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_eia__region_data')
        format: csv
        rows: |
          ba_code,series_code,period_utc,value_mwh,record_hash,ingested_at_utc
          PJM,D,2026-10-01 00:00:00,100.0,a,2026-10-01 02:00:00
          PJM,D,2026-10-01 00:00:00,100.0,a,2026-10-01 03:00:00
          PJM,D,2026-10-01 00:00:00,110.0,b,2026-10-02 02:00:00
          PJM,D,2026-10-01 00:00:00,100.0,a,2026-10-03 02:00:00
          PJM,DF,2026-10-01 00:00:00,,n,2026-10-01 02:00:00
          PJM,DF,2026-10-01 00:00:00,95.0,f,2026-10-01 05:00:00
      - input: ref('stg_eia__fuel_type_data')
        format: csv
        rows: |
          ba_code,fuel_code,period_utc,generation_mwh,record_hash,ingested_at_utc
          PJM,NG,2026-10-01 00:00:00,50.0,g1,2026-10-01 02:00:00
          PJM,NG,2026-10-01 00:00:00,52.0,g2,2026-10-04 02:00:00
      - input: ref('stg_eia__interchange_data')
        format: csv
        rows: |
          from_ba_code,to_ba_code,period_utc,interchange_mwh,record_hash,ingested_at_utc
          PJM,MISO,2026-10-01 00:00:00,10.0,i1,2026-10-01 02:00:00
          PJM,MISO,2026-10-01 00:00:00,10.0,i1,2026-10-02 02:00:00
    expect:
      format: csv
      rows: |
        route,ba_code,item_code,period_utc,previous_value_mwh,revised_value_mwh,previous_ingested_at_utc,revised_at_utc
        region-data,PJM,D,2026-10-01 00:00:00,100.0,110.0,2026-10-01 03:00:00,2026-10-02 02:00:00
        region-data,PJM,D,2026-10-01 00:00:00,110.0,100.0,2026-10-02 02:00:00,2026-10-03 02:00:00
        region-data,PJM,DF,2026-10-01 00:00:00,,95.0,2026-10-01 02:00:00,2026-10-01 05:00:00
        fuel-type-data,PJM,NG,2026-10-01 00:00:00,50.0,52.0,2026-10-01 02:00:00,2026-10-04 02:00:00

  - name: revisions_incremental_run_compares_with_old_versions
    description: >
      In an incremental run, a new load revising an hour must be compared with the previous
      version even when that version was loaded long before the watermark; revisions already
      recorded (before the watermark) are not emitted again.
    model: int_grid__revisions
    overrides:
      macros:
        is_incremental: true
    given:
      # SQL rather than CSV, so dbt need not read `this` from the warehouse (on a fresh lake
      # the table does not exist yet). Its latest revised_at_utc is the watermark.
      - input: this
        format: sql
        rows: |
          select
              'region-data' as route, 'PJM' as ba_code, 'D' as item_code,
              timestamp '2026-09-01 00:00:00' as period_utc,
              100.0e0 as previous_value_mwh, 105.0e0 as revised_value_mwh,
              timestamp '2026-09-01 02:00:00' as previous_ingested_at_utc,
              timestamp '2026-09-05 02:00:00' as revised_at_utc
      - input: ref('stg_eia__region_data')
        format: csv
        rows: |
          ba_code,series_code,period_utc,value_mwh,record_hash,ingested_at_utc
          PJM,D,2026-09-01 00:00:00,100.0,a,2026-09-01 02:00:00
          PJM,D,2026-09-01 00:00:00,105.0,b,2026-09-05 02:00:00
          PJM,D,2026-08-01 00:00:00,80.0,c,2026-08-01 02:00:00
          PJM,D,2026-08-01 00:00:00,81.0,d,2026-10-10 02:00:00
          PJM,D,2026-09-01 00:00:00,105.0,b,2026-10-10 02:00:00
      - input: ref('stg_eia__fuel_type_data')
        format: dict
        rows: []
      - input: ref('stg_eia__interchange_data')
        format: dict
        rows: []
    expect:
      format: csv
      rows: |
        route,ba_code,item_code,period_utc,previous_value_mwh,revised_value_mwh,previous_ingested_at_utc,revised_at_utc
        region-data,PJM,D,2026-08-01 00:00:00,80.0,81.0,2026-08-01 02:00:00,2026-10-10 02:00:00
