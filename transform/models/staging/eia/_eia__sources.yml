version: 2

sources:
  - name: eia_raw
    description: >
      Append-only raw tables written by the ingestion extractors (one Iceberg commit per run).
      Every pull of every hour is kept, so the same row appears once per load.
    schema: raw
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 2, period: hour}
        error_after: {count: 6, period: hour}
    tables:
      - name: eia_region_data
        description: >
          EIA API v2 `electricity/rto/region-data`: hourly demand (D), day-ahead demand
          forecast (DF), net generation (NG) and total interchange (TI) per balancing authority.
          Values are strings exactly as the API returned them.
        columns:
          - name: period
            description: Hour as returned by the API (`YYYY-MM-DDTHH`, UTC).
          - name: period_utc
            description: Start of the hour, UTC.
          - name: respondent
            description: Balancing authority code.
          - name: type
            description: Series code (D, DF, NG, TI).
          - name: value
            description: Value as a string; null when the BA did not report it.
          - name: _record_hash
            description: SHA-256 of period, respondent, type, value and units. Identifies a version.
          - name: _ingested_at
            description: When the run that pulled this row started (UTC).
      - name: eia_fuel_type_data
        description: >
          EIA API v2 `electricity/rto/fuel-type-data`: hourly net generation by fuel per
          balancing authority. Values are strings exactly as the API returned them.
        columns:
          - name: respondent
            description: Balancing authority code.
          - name: fueltype
            description: EIA fuel code (COL, NG, NUC, WND, SUN, ...); mapped by seed `fuel_type_map`.
          - name: value
            description: Net generation for the hour as a string; storage can be negative (charging).
          - name: _record_hash
            description: SHA-256 of period, respondent, fueltype, value and units.
          - name: _ingested_at
            description: When the run that pulled this row started (UTC).
      - name: eia_interchange_data
        description: >
          EIA API v2 `electricity/rto/interchange-data`: hourly flow from one balancing
          authority to a directly connected neighbour. Positive = export from `fromba`.
        columns:
          - name: fromba
            description: Reporting balancing authority (the flow's origin).
          - name: toba
            description: Neighbouring balancing authority.
          - name: value
            description: Flow for the hour as a string; positive = fromba exports to toba.
          - name: _record_hash
            description: SHA-256 of period, fromba, toba, value and units.
          - name: _ingested_at
            description: When the run that pulled this row started (UTC).
