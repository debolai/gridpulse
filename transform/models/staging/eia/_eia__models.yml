version: 2

models:
  - name: stg_eia__region_data
    description: >
      Typed EIA region-data observations. Grain: BA × series × hour × load. Values are cast
      from strings to doubles; exact duplicates within a load are dropped.
    columns:
      - name: ba_code
        description: Balancing authority code (EIA respondent).
        data_tests: [not_null]
      - name: series_code
        description: "D = demand, DF = day-ahead demand forecast, NG = net generation, TI = total interchange."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["D", "DF", "NG", "TI"]
      - name: period_utc
        description: Start of the hour, UTC.
        data_tests: [not_null]
      - name: value_mwh
        description: Value in MWh for the hour. Null when the BA did not report it.
      - name: value_units
        data_tests:
          - accepted_values:
              arguments:
                values: ["megawatthours"]
      - name: record_hash
        description: Identifies a version of the row (business fields hashed at ingestion).
        data_tests: [not_null]
      - name: ingested_at_utc
        description: Start time of the load that observed this value.
        data_tests: [not_null]

  - name: stg_eia__fuel_type_data
    description: >
      Typed EIA fuel-type observations. Grain: BA × fuel × hour × load. Values are cast from
      strings to doubles; exact duplicates within a load are dropped.
    columns:
      - name: ba_code
        description: Balancing authority code (EIA respondent).
        data_tests: [not_null]
      - name: fuel_code
        description: EIA fuel code. A code missing from seed `fuel_type_map` warns, not fails.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fuel_type_map')
                field: fuel_code
              config:
                severity: warn
      - name: period_utc
        description: Start of the hour, UTC.
        data_tests: [not_null]
      - name: generation_mwh
        description: Net generation in MWh for the hour; negative for storage while charging.
      - name: value_units
        data_tests:
          - accepted_values:
              arguments:
                values: ["megawatthours"]
      - name: record_hash
        data_tests: [not_null]
      - name: ingested_at_utc
        data_tests: [not_null]

  - name: stg_eia__interchange_data
    description: >
      Typed EIA interchange observations. Grain: BA × neighbour × hour × load. Positive =
      from_ba_code exports to to_ba_code.
    columns:
      - name: from_ba_code
        description: Reporting balancing authority.
        data_tests: [not_null]
      - name: to_ba_code
        description: Neighbouring balancing authority (may be Canadian or Mexican).
        data_tests: [not_null]
      - name: period_utc
        data_tests: [not_null]
      - name: interchange_mwh
        description: Flow in MWh; positive = export from from_ba_code.
      - name: value_units
        data_tests:
          - accepted_values:
              arguments:
                values: ["megawatthours"]
      - name: record_hash
        data_tests: [not_null]
      - name: ingested_at_utc
        data_tests: [not_null]
