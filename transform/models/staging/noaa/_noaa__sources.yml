version: 2

sources:
  - name: noaa_raw
    description: >
      NOAA GHCNh (Global Historical Climatology Network hourly) station reports, appended by
      the extractor from the public bucket noaa-ghcnh-pds (ADR-0004). Every load is kept.
    schema: raw
    config:
      loaded_at_field: _ingested_at
      freshness:
        # NOAA publishes with about a 1.5-day lag and the extractor runs daily.
        warn_after: {count: 3, period: day}
        error_after: {count: 5, period: day}
    tables:
      - name: noaa_ghcnh_observations
        description: >
          One row per station report that carries a temperature (routine METAR at :51,
          synoptic at :00, specials). Units as published: °C, m/s, %.
        columns:
          - name: station_id
            description: GHCNh station id (USW000 + WBAN for U.S. airports).
          - name: observed_at_utc
            description: Observation time, UTC, to the minute.
          - name: report_type
            description: Report type (FM15 = routine METAR, FM16 = special, FM12 = synoptic).
          - name: temperature_c
            description: Air temperature, °C.
          - name: temperature_quality_code
            description: GHCNh or legacy source quality code for the temperature (see staging).
          - name: _record_hash
            description: SHA-256 of the report's fields. Identifies a version.
          - name: _ingested_at
            description: When the run that loaded this report started (UTC).
