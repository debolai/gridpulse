[project]
name = "gridpulse"
version = "0.1.0"
description = "Grid operations analytics platform: EIA + NOAA data, Iceberg lake, dbt, MetricFlow, LangGraph agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "gridpulse-ingestion",
    "pre-commit",
    "pytest",
    "respx",
    "trino",
    "ruff",
    "yamllint",
]

# dbt runs from the same locked environment as everything else (see transform/).
transform = [
    "dbt-core>=1.12,<1.13",
    "dbt-trino",
    "dbt-athena",
]

[tool.uv]
default-groups = ["dev", "transform"]

# Component packages (ingestion, semantic, agent, ...) join this workspace as they are built.
[tool.uv.workspace]
members = ["ingestion"]

[tool.uv.sources]
gridpulse-ingestion = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["gridpulse_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests", "ingestion/tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs the local stack running (make up-lake)"]
