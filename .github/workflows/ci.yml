name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan every commit, not just the tip
      - name: gitleaks over the full history
        run: make secrets-history

  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make test
      - name: dbt parse (validates models, YAML, contracts and unit-test definitions)
        run: make dbt-deps && DBT_PROJECT_DIR=transform DBT_PROFILES_DIR=transform uv run dbt parse --no-partial-parse
      - name: MetricFlow validate (semantic models and metrics; warehouse checks run locally)
        run: cd transform && DBT_PROFILES_DIR=. uv run mf validate-configs --skip-dw

  # The whole data stack on real data, no AWS: the local lake (SeaweedFS, Lakekeeper, Trino,
  # Postgres) from compose, loaded with the committed raw sample (28 Sep - 13 Oct 2026, the six
  # sample BAs). Catches SQL that parses but fails when run, and wrong numbers.
  local-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Start the local lake
        run: make up-lake
      - name: Load the committed raw sample (through the extractor's own sink)
        run: make ci-sample-load
      - name: dbt build, then again (the second run takes the incremental paths)
        run: make dbt-build && make dbt-build
      - name: MetricFlow validate, including the warehouse checks
        run: make semantic-manifest && make mf ARGS=validate-configs
      - name: Integration tests (every metric vs hand-written SQL, dbt into test schemas, agent memory)
        run: make test-integration
      - name: Trino and Lakekeeper logs
        if: failure()
        run: docker compose -f local/compose.yaml --profile lake logs --tail 200 trino lakekeeper
      - name: Stop the lake
        if: always()
        run: make down

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # One image per component (blueprint), each with a smoke test. Layers are cached between
      # runs in the GitHub Actions cache, one scope per image.
      - name: Build images
        run: |
          build() {  # build <component> [extra args]
            docker buildx build --load -f "$1/Dockerfile" -t "gridpulse/$1:ci" \
              --cache-from "type=gha,scope=$1" --cache-to "type=gha,mode=max,scope=$1" "${@:2}" .
          }
          build ingestion
          build transform
          build semantic
          build agent
          # Starts FROM the transform image just built. The cached builder runs in its own
          # container and can't see local images, so this one uses Docker's built-in builder.
          docker buildx build --builder default --load -f orchestration/Dockerfile \
            --build-arg TRANSFORM_IMAGE=gridpulse/transform:ci -t gridpulse/orchestration:ci .
      - name: Smoke test the images
        run: |
          docker run --rm gridpulse/ingestion:ci --help
          docker run --rm --entrypoint dbt gridpulse/transform:ci --version
          docker run --rm --entrypoint python gridpulse/semantic:ci -c "import gridpulse_semantic.app"
          docker run --rm --entrypoint gridpulse-agent-eval gridpulse/agent:ci --help
      - name: DAG integrity on both runtimes (imports, retries, timeouts, alerts, EIA pool)
        run: |
          for rt in docker kubernetes; do
            docker run --rm -e GRIDPULSE_TASK_RUNTIME=$rt --entrypoint python \
              gridpulse/orchestration:ci /opt/airflow/tests/dag_integrity.py
          done

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -recursive -check infra/terraform
      - name: validate (no backend, no AWS access needed)
        run: |
          terraform -chdir=infra/terraform/envs/dev/foundation init -backend=false -input=false
          terraform -chdir=infra/terraform/envs/dev/foundation validate
