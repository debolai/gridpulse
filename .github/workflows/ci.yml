name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan every commit, not just the tip
      - name: gitleaks over the full history
        run: make secrets-history

  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make test
      - name: dbt parse (validates models, YAML, contracts and unit-test definitions)
        run: make dbt-deps && DBT_PROJECT_DIR=transform DBT_PROFILES_DIR=transform uv run dbt parse --no-partial-parse
      - name: MetricFlow validate (semantic models and metrics; warehouse checks run locally)
        run: cd transform && DBT_PROFILES_DIR=. uv run mf validate-configs --skip-dw

  # The whole data stack on real data, no AWS: the local lake (SeaweedFS, Lakekeeper, Trino,
  # Postgres) from compose, loaded with the committed raw sample (28 Sep - 13 Oct 2026, the six
  # sample BAs). Catches SQL that parses but fails when run, and wrong numbers.
  local-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Start the local lake
        run: make up-lake
      - name: Load the committed raw sample (through the extractor's own sink)
        run: make ci-sample-load
      - name: dbt build, then again (the second run takes the incremental paths)
        run: make dbt-build && make dbt-build
      - name: MetricFlow validate, including the warehouse checks
        run: make semantic-manifest && make mf ARGS=validate-configs
      - name: Integration tests (every metric vs hand-written SQL, dbt into test schemas, agent memory)
        run: make test-integration
      - name: Docs site (dbt docs + Elementary report; CD publishes the same build to GitHub Pages)
        run: make docs-site
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          retention-days: 7
      - name: Trino and Lakekeeper logs
        if: failure()
        run: docker compose -f local/compose.yaml --profile lake logs --tail 200 trino lakekeeper
      - name: Stop the lake
        if: always()
        run: make down

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # One image per component (blueprint), each with a smoke test. Layers are cached between
      # runs in the GitHub Actions cache, one scope per image.
      - name: Build images
        run: |
          build() {  # build <component> [extra args]
            docker buildx build --load -f "$1/Dockerfile" -t "gridpulse/$1:ci" \
              --cache-from "type=gha,scope=$1" --cache-to "type=gha,mode=max,scope=$1" "${@:2}" .
          }
          build ingestion
          build transform
          build semantic
          build agent
          # Starts FROM the transform image just built. The cached builder runs in its own
          # container and can't see local images, so this one uses Docker's built-in builder.
          docker buildx build --builder default --load -f orchestration/Dockerfile \
            --build-arg TRANSFORM_IMAGE=gridpulse/transform:ci -t gridpulse/orchestration:ci .
      - name: Smoke test the images
        run: |
          docker run --rm gridpulse/ingestion:ci --help
          docker run --rm --entrypoint dbt gridpulse/transform:ci --version
          docker run --rm --entrypoint python gridpulse/semantic:ci -c "import gridpulse_semantic.app"
          docker run --rm --entrypoint gridpulse-agent-eval gridpulse/agent:ci --help
      - name: DAG integrity on both runtimes (imports, retries, timeouts, alerts, EIA pool)
        run: |
          for rt in docker kubernetes; do
            docker run --rm -e GRIDPULSE_TASK_RUNTIME=$rt --entrypoint python \
              gridpulse/orchestration:ci /opt/airflow/tests/dag_integrity.py
          done

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -recursive -check infra/terraform
      - name: validate both stacks (no backend, no AWS access needed)
        run: |
          for stack in foundation compute; do
            terraform -chdir=infra/terraform/envs/dev/$stack init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/dev/$stack validate
          done
      - name: tflint and checkov
        run: make tf-lint
      - name: helm lint and kubeconform (the demo chart)
        run: make helm-lint

  # Which parts of the repo a pull request touches, so AWS jobs only run when they matter.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      terraform: ${{ steps.diff.outputs.terraform }}
      dbt: ${{ steps.diff.outputs.dbt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          touched() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          echo "terraform=$(touched '^infra/terraform/|^infra/scripts/ci-plan.sh')" >> "$GITHUB_OUTPUT"
          echo "dbt=$(touched '^transform/')" >> "$GITHUB_OUTPUT"

  # `terraform plan` of both dev stacks with the read-only CI role, posted on the PR (one
  # comment, updated on every push). Forks get no OIDC token, so this runs for this repo only.
  terraform-plan:
    needs: changes
    if: needs.changes.outputs.terraform == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Plan both stacks (read-only, no state lock)
        run: infra/scripts/ci-plan.sh plan.md
      - name: Post or update the plan comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          [ -f plan.md ] || exit 0
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- gridpulse-terraform-plan -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@plan.md >/dev/null
          else
            gh pr comment "$PR" --body-file plan.md
          fi
          cat plan.md >> "$GITHUB_STEP_SUMMARY"

  # dbt slim CI on Athena: build only the models this PR changed and everything downstream,
  # into ci_pr_<n>_* databases; unchanged parents are read from the real tables (deferral to
  # the manifest of main). pr-cleanup.yml drops the databases when the PR closes.
  slim-ci:
    needs: changes
    if: needs.changes.outputs.dbt == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DBT_TARGET: aws
      GRIDPULSE_SCHEMA_PREFIX: ci_pr_${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Manifest of main (what "modified" is compared with)
        run: aws s3 cp --only-show-errors s3://gridpulse-dev-lake/ci/dbt-state/manifest.json state/manifest.json
      - name: Build modified models and their children into ci_pr_${{ github.event.number }}_*
        env:
          DBT_PROJECT_DIR: transform
          DBT_PROFILES_DIR: transform
        run: |
          make dbt-deps
          state="$GITHUB_WORKSPACE/state"
          {
            echo "### dbt slim CI: built into ci_pr_${{ github.event.number }}_*"
            echo '```'
            uv run --quiet dbt ls --select state:modified+ --state "$state" --resource-type model --output name
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          uv run dbt build --select state:modified+ --defer --state "$state"
