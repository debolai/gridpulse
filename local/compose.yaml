# GridPulse local stack. Run through the Makefile (`make up-lake`, `make down`, ...), not directly.
#
# Profiles keep memory down: start only what the task needs.
#   lake : Postgres, SeaweedFS (S3), Lakekeeper (Iceberg REST catalog), Trino   ~3 GB
#   orch : lake + Airflow (scheduler, API/UI on http://localhost:8088)  +2 GB
#   app  : semantic API, agent API, Streamlit (added in A4/A5)
#   tools: one-shot jobs such as the extractor (`make extract`)
#
# Every image is pinned by tag + digest. Every long-running service has a memory limit.
# Credentials below are local-only placeholders, not secrets; real ones live in .env / AWS SSM.

name: gridpulse

x-labels: &labels
  com.gridpulse.project: gridpulse

x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_ENCRYPTION_KEY: local-dev-only-not-a-secret
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://gridpulse:gridpulse@postgres:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://gridpulse:gridpulse@postgres:5432/lakekeeper
  RUST_LOG: info
  # Address clients use for the catalog and its S3 request signer (remote signing).
  LAKEKEEPER__BASE_URI: http://lakekeeper:8181

services:
  postgres:
    profiles: [lake, orch, app]
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    labels: *labels
    environment:
      POSTGRES_USER: gridpulse
      POSTGRES_PASSWORD: gridpulse
      POSTGRES_DB: gridpulse
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridpulse -d gridpulse"]
      interval: 2s
      timeout: 5s
      retries: 15

  seaweedfs:
    profiles: [lake, orch, app]
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    labels: *labels
    # `mini` = single-process dev mode (master + volume + filer + S3 gateway).
    # Buckets mirror the AWS layout: raw (API responses), lake (Iceberg tables), logs (Airflow).
    command:
      - mini
      - -dir=/data
      - -bucket=gridpulse-local-raw,gridpulse-local-lake,gridpulse-local-logs
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"
    mem_limit: 768m
    # Healthy only once signed S3 requests are accepted: /status answers before the access keys
    # are loaded, and early writes then fail with Access Denied (seen on the first Airflow run).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf --aws-sigv4 "aws:amz:local-01:s3" --user gridpulse-local:gridpulse-local-secret
          "http://localhost:8333/gridpulse-local-lake?list-type=2&max-keys=1" >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  lakekeeper-migrate:
    profiles: [lake, orch, app]
    image: quay.io/lakekeeper/catalog:v0.13.6@sha256:d6829722cac0d00dfc5665b0955766387b93ccadd8b1e70e679b49619bc30ea5
    labels: *labels
    environment: *lakekeeper-env
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  lakekeeper:
    profiles: [lake, orch, app]
    image: quay.io/lakekeeper/catalog:v0.13.6@sha256:d6829722cac0d00dfc5665b0955766387b93ccadd8b1e70e679b49619bc30ea5
    labels: *labels
    environment: *lakekeeper-env
    command: ["serve"]
    ports:
      - "8181:8181"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully

  # One-shot: accept terms, create the `gridpulse` warehouse. Safe to rerun.
  lake-init:
    profiles: [lake, orch, app]
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    labels: *labels
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      - ./lake:/init:ro
    restart: "no"
    depends_on:
      lakekeeper:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  trino:
    profiles: [lake, orch, app]
    image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
    labels: *labels
    # The image sizes the JVM heap at 80% of the container limit (~2 GB here).
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    ports:
      - "8080:8080"
    mem_limit: 2560m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    depends_on:
      lake-init:
        condition: service_completed_successfully

  # Creates per-consumer databases on the shared Postgres. Idempotent (init.sql only runs on an
  # empty volume, so databases added later need this).
  postgres-init:
    profiles: [lake, orch, app]
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    labels: *labels
    environment:
      PGPASSWORD: gridpulse
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for db in lakekeeper airflow airflow_k8s agent; do
          psql -h postgres -U gridpulse -d gridpulse -tc "SELECT 1 FROM pg_database WHERE datname='$$db'" \
            | grep -q 1 || psql -h postgres -U gridpulse -d gridpulse -c "CREATE DATABASE $$db"
        done
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Airflow 3 in one container (`airflow standalone`: api-server, scheduler, dag-processor,
  # triggerer) with LocalExecutor. Tasks run as sibling containers through the Docker socket
  # (GRIDPULSE_TASK_RUNTIME=docker). The Kubernetes deployment (k3d, EKS) uses the Helm chart.
  # Build it with `make images` (it copies the dbt manifest from the transform image).
  airflow:
    profiles: [orch]
    image: gridpulse/orchestration:local
    labels: *labels
    env_file:
      - path: ../.env
        required: false
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://gridpulse:gridpulse@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      # Local only: no login screen. The EKS deployment uses real auth.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      GRIDPULSE_TASK_RUNTIME: docker
      GRIDPULSE_DOCKER_NETWORK: gridpulse_default
      # The semantic API runs on the host during local development (`make semantic-api`).
      GRIDPULSE_SEMANTIC_API_URL: http://host.docker.internal:8090
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - bash
      - -c
      - |
        export AIRFLOW_VAR_EIA_API_KEY="$${EIA_API_KEY:-}"
        export AIRFLOW_VAR_OPENAI_API_KEY="$${GRIDPULSE_AGENT_OPENAI_API_KEY:-}"
        export AIRFLOW_VAR_AGENT_PROVIDER="$${GRIDPULSE_AGENT_PROVIDER:-bedrock}"
        airflow db migrate >/dev/null &&
        airflow pools set eia_api 2 "EIA API: at most 2 concurrent extract tasks" >/dev/null &&
        exec airflow standalone
    volumes:
      - ../orchestration/dags:/opt/airflow/dags
      - ../orchestration/tests:/opt/airflow/tests
      - ../transform/seeds/ba_weather_stations.csv:/opt/airflow/dbt/ba_weather_stations.csv:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8088:8080"
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v2/monitor/health | grep -q healthy"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      lake-init:
        condition: service_completed_successfully

  # One-shot extractor, run via `make extract ...`. Same image as the Airflow/Kubernetes task.
  extractor:
    profiles: [tools]
    build:
      context: ..
      dockerfile: ingestion/Dockerfile
    image: gridpulse/ingestion:local
    labels: *labels
    env_file:
      - path: ../.env
        required: false
    environment:
      GRIDPULSE_RAW_BUCKET: gridpulse-local-raw
      GRIDPULSE_S3_ENDPOINT: http://seaweedfs:8333
      GRIDPULSE_S3_ACCESS_KEY: gridpulse-local
      GRIDPULSE_S3_SECRET_KEY: gridpulse-local-secret
      GRIDPULSE_S3_REGION: local-01
      GRIDPULSE_CATALOG_TYPE: rest
      GRIDPULSE_CATALOG_URI: http://lakekeeper:8181/catalog
      GRIDPULSE_CATALOG_WAREHOUSE: gridpulse
    mem_limit: 1g
    restart: "no"

volumes:
  postgres-data:
    labels: *labels
  seaweedfs-data:
    labels: *labels
