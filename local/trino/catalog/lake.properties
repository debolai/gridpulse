# Iceberg tables in the local warehouse, via the Lakekeeper REST catalog.
# On AWS the same schemas live in Glue and are queried by Athena.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=gridpulse
iceberg.file-format=PARQUET
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=local-01
s3.path-style-access=true
s3.aws-access-key=gridpulse-local
s3.aws-secret-key=gridpulse-local-secret
