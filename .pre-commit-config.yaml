# Hooks run the tool versions pinned in uv.lock, so local, pre-commit and CI always agree.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: yamllint
        name: yamllint
        entry: uv run yamllint --strict
        language: system
        types: [yaml]
      - id: todo-not-tracked
        name: TODO.md must stay untracked
        entry: TODO.md is personal and git-ignored; do not commit it
        language: fail
        files: ^TODO\.md$
