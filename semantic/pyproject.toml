[project]
name = "gridpulse-semantic"
version = "0.1.0"
description = "Self-hosted semantic API: governed GridPulse metrics served through open-source MetricFlow."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "dbt-metricflow[dbt-trino,dbt-athena]",
]

[project.scripts]
gridpulse-semantic = "gridpulse_semantic.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridpulse_semantic"]
