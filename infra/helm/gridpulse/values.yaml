# Image repository prefix and tag are set by `make aws-up` (ECR URL + Git SHA).
image:
  registry: ""
  tag: latest
  pullPolicy: IfNotPresent

region: us-east-1
env: dev

semantic:
  replicas: 1
  dbtTarget: aws
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 1536Mi}

agent:
  replicas: 1
  provider: bedrock
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 768Mi}

ui:
  enabled: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
