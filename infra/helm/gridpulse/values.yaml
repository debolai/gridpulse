# Image repository prefix and tag are set by `make aws-up` (ECR URL + Git SHA).
image:
  registry: ""
  tag: latest
  pullPolicy: IfNotPresent

region: us-east-1
env: dev

semantic:
  replicas: 1
  dbtTarget: aws
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {memory: 1536Mi}

agent:
  replicas: 1
  provider: bedrock
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 768Mi}

# Conversation memory (templates/memory.yaml): Postgres in the cluster, same image as compose.
memory:
  enabled: true
  image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

ui:
  enabled: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
