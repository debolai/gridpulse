# Semantic API: MetricFlow over Athena. Its service account maps to an IAM role (EKS Pod
# Identity) that can query Athena, read the catalog and lake, and write query results.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: semantic
  labels: {{- include "gridpulse.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-api
  labels:
    app.kubernetes.io/name: semantic-api
    {{- include "gridpulse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.semantic.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: semantic-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: semantic-api
        {{- include "gridpulse.labels" . | nindent 8 }}
    spec:
      serviceAccountName: semantic
      containers:
        - name: semantic-api
          image: {{ include "gridpulse.image" (dict "root" . "component" "semantic") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "gridpulse.securityContext" . | nindent 10 }}
          env:
            - {name: DBT_TARGET, value: {{ .Values.semantic.dbtTarget | quote }}}
            - {name: AWS_REGION, value: {{ .Values.region | quote }}}
            - {name: GRIDPULSE_ENV, value: {{ .Values.env | quote }}}
          ports:
            - {name: http, containerPort: 8090}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources: {{- toYaml .Values.semantic.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: semantic-api
  labels: {{- include "gridpulse.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: semantic-api}
  ports:
    - {name: http, port: 8090, targetPort: http}
