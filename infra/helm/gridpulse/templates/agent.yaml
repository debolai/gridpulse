# Assistant API (LangGraph + Claude on Bedrock) and the Streamlit demo UI. Nothing is exposed
# outside the cluster: open the UI with `kubectl port-forward` (see make aws-up output).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  labels: {{- include "gridpulse.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
  labels:
    app.kubernetes.io/name: agent-api
    {{- include "gridpulse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agent.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: agent-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-api
        {{- include "gridpulse.labels" . | nindent 8 }}
    spec:
      serviceAccountName: agent
      containers:
        - name: agent-api
          image: {{ include "gridpulse.image" (dict "root" . "component" "agent") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "gridpulse.securityContext" . | nindent 10 }}
          env:
            - {name: GRIDPULSE_AGENT_PROVIDER, value: {{ .Values.agent.provider | quote }}}
            - {name: GRIDPULSE_AGENT_AWS_REGION, value: {{ .Values.region | quote }}}
            - {name: GRIDPULSE_AGENT_SEMANTIC_API_URL, value: "http://semantic-api:8090"}
          ports:
            - {name: http, containerPort: 8091}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-api
  labels: {{- include "gridpulse.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: agent-api}
  ports:
    - {name: http, port: 8091, targetPort: http}
{{- if .Values.ui.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-ui
  labels:
    app.kubernetes.io/name: agent-ui
    {{- include "gridpulse.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: agent-ui}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-ui
        {{- include "gridpulse.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: agent-ui
          image: {{ include "gridpulse.image" (dict "root" . "component" "agent") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "gridpulse.securityContext" . | nindent 10 }}
          command: ["streamlit", "run", "/app/.venv/lib/python3.12/site-packages/gridpulse_agent/ui.py",
                    "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
          env:
            - {name: GRIDPULSE_AGENT_URL, value: "http://agent-api:8091"}
          ports:
            - {name: http, containerPort: 8501}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            periodSeconds: 10
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-ui
  labels: {{- include "gridpulse.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: agent-ui}
  ports:
    - {name: http, port: 8501, targetPort: http}
{{- end }}
