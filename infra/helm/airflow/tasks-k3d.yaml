# Environment for the task pods that DAGs launch (KubernetesPodOperator, Cosmos), one ConfigMap
# and ServiceAccount per component; `make k3d-secrets` adds the Secrets (EIA key) from .env.
# On EKS the same names carry the AWS settings, and each ServiceAccount maps to an IAM role.
apiVersion: v1
kind: ServiceAccount
metadata: {name: gridpulse-extractor, namespace: airflow}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: gridpulse-dbt, namespace: airflow}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: gridpulse-agent, namespace: airflow}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: gridpulse-extractor, namespace: airflow}
data:
  GRIDPULSE_RAW_BUCKET: gridpulse-local-raw
  GRIDPULSE_S3_ENDPOINT: http://seaweedfs:8333
  GRIDPULSE_S3_ACCESS_KEY: gridpulse-local
  GRIDPULSE_S3_SECRET_KEY: gridpulse-local-secret
  GRIDPULSE_S3_REGION: local-01
  GRIDPULSE_CATALOG_TYPE: rest
  GRIDPULSE_CATALOG_URI: http://lakekeeper:8181/catalog
  GRIDPULSE_CATALOG_WAREHOUSE: gridpulse
---
apiVersion: v1
kind: ConfigMap
metadata: {name: gridpulse-dbt, namespace: airflow}
data:
  DBT_TARGET: local
  TRINO_HOST: trino
  TRINO_PORT: "8080"
  # Elementary report upload (scripts/elementary-report.sh); local dummy credentials.
  GRIDPULSE_REPORTS_BUCKET: gridpulse-local-lake
  GRIDPULSE_S3_ENDPOINT: http://seaweedfs:8333
  GRIDPULSE_S3_ACCESS_KEY: gridpulse-local
  GRIDPULSE_S3_SECRET_KEY: gridpulse-local-secret
  GRIDPULSE_S3_REGION: local-01
---
apiVersion: v1
kind: ConfigMap
metadata: {name: gridpulse-agent, namespace: airflow}
data:
  # The agent uses Bedrock only inside Kubernetes (API-key providers are local-only).
  GRIDPULSE_AGENT_PROVIDER: bedrock
  GRIDPULSE_AGENT_SEMANTIC_API_URL: http://host.k3d.internal:8090
